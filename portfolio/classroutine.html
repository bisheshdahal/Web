<!DOCTYPE html>
<html>
<head>
<title>BDS Class Routine - 200 Level</title>
<style>
  body {
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 30px;
    background-color: #f4f4f4;
  }
  table {
    border-collapse: collapse;
    width: 90%;
    max-width: 900px;
    background-color: white;
    box-shadow: 0 0 8px rgba(0,0,0,0.15);
  }
  caption {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 12px;
  }
  th, td {
    border: 1px solid #333;
    padding: 12px;
    text-align: center;
  }
  th {
    background-color: #2e7d5b;
    color: white;
  }
  td.day {
    background-color: #d9e8d8;
    font-weight: bold;
  }
  tr:nth-child(even) td:not(.day) {
    background-color: #f9f9f9;
  }
</style>
</head>
<body>

<table>
  <caption>Class Routine (BDS 200 Level Only)</caption>
  <tr>
    <th>Day</th>
    <th>11:00-12:30</th>
    <th>12:30-02:00</th>
    <th>02:30-04:00</th>
  </tr>
  <tr>
    <td class="day">MON</td>
    <td>BDS 255 (RD)</td>
    <td>BDS 253 (SS)</td>
    <td>BDS 251 (AKL)</td>
  </tr>
  <tr>
    <td class="day">TUE</td>
    <td>BDS 255 (RD)</td>
    <td>BDS 252 (PM)</td>
    <td>BDS 251 (AKL)</td>
  </tr>
  <tr>
    <td class="day">WED</td>
    <td>BDS 255 (RD)</td>
    <td>BDS 254 (PMB)</td>
    <td>BDS 251 (AKL)</td>
  </tr>
  <tr>
    <td class="day">THU</td>
    <td>BDS 254 (PMB)</td>
    <td>BDS 252 (PM)</td>
    <td>BDS 253 (SS)</td>
  </tr>
  <tr>
    <td class="day">FRI</td>
    <td>BDS 254 (PMB)</td>
    <td>BDS 252 (PM)</td>
    <td>BDS 253 (SS)</td>
  </tr>
</table>

</body>
</html>
