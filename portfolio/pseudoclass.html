<!DOCTYPE html>
<html>
<head>
<style>
  .quote {
    font-size: 18px;
    font-style: italic;
    padding: 10px;
  }
  .quote::before {
    content: "“";
    font-size: 24px;
    color: #2e7d5b;
  }
  .quote::after {
    content: "”";
    font-size: 24px;
    color: #2e7d5b;
  }
</style>
</head>
<body>
  <p class="quote">This is a sample quote using pseudo-elements</p>
</body>
</html>
