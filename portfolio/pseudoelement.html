<!DOCTYPE html>
<html>
<head>
<style>
  ul { list-style: none; padding: 0; width: 200px; }
  li {
    padding: 10px;
    background-color: #eee;
    margin-bottom: 5px;
  }
  li:hover {
    background-color: #4CAF50;
    color: white;
  }
  li:nth-child(odd) {
    background-color: #ddd;
  }
</style>
</head>
<body>
  <ul>
    <li>Item 1</li>
    <li>Item 2</li>
    <li>Item 3</li>
    <li>Item 4</li>
  </ul>
</body>
</html>
